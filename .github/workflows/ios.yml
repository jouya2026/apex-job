name: ساخت اپلیکیشن آیفون (iOS) و ارسال به App Store

# فقط دستی اجرا می‌شود (Actions ← این ورک‌فلو ← Run workflow)، چون ساخت iOS روی سرور macOS سنگین است.
# Secretهای لازم (رهنما: STORE-PUBLISHING.md):
#   IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD, IOS_PROFILE_BASE64
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8   (برای ارسال خودکار به TestFlight / App Store Connect)

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'ارسال به App Store Connect (TestFlight)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.apexjob.app
      BUILD_NO: ${{ github.run_number }}
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: npm ci --no-audit --no-fund

      - name: ساخت نسخه وب برای اپ
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          VITE_APP_BUILD: ${{ github.run_number }}
          VITE_PUSH_ENABLED: 'false'

      - name: ساخت پروژه iOS
        run: |
          npx cap add ios
          # اپل آیکون شفاف نمی‌پذیرد: نسخه بدون شفافیت (store/ios/icon-1024.png) فقط برای ساخت iOS جایگزین می‌شود
          [ -f store/ios/icon-1024.png ] && cp store/ios/icon-1024.png assets/icon-only.png
          npx @capacitor/assets generate --ios --iconBackgroundColor '#FFFFFF' --splashBackgroundColor '#FBF6EC' --splashBackgroundColorDark '#0E1420' || echo "::warning::ساخت آیکون ناموفق"
          npx cap sync ios

      - name: نصب گواهی و پروفایل امضا
        env:
          P12_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          if [ -z "$P12_B64" ] || [ -z "$PROFILE_B64" ]; then echo "::error::IOS_CERT_P12_BASE64 یا IOS_PROFILE_BASE64 تنظیم نشده است."; exit 1; fi
          KC="$RUNNER_TEMP/build.keychain-db"; KC_PASS=$(uuidgen)
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASS" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" > /dev/null
          security list-keychain -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM" >> "$GITHUB_ENV"
          echo "پروفایل: $NAME — تیم: $TEAM"

      - name: تنظیم امضا، نسخه و آیفون‌تنها (فقط هدف App)
        run: |
          python3 - <<'PY'
          import os, re
          p = 'ios/App/App.xcodeproj/project.pbxproj'
          s = open(p, encoding='utf-8').read()
          team, prof = os.environ['TEAM_ID'], os.environ['PROFILE_NAME']
          ver, build = os.environ['VERSION'], os.environ['BUILD_NO']
          def fix(block):
              if 'PRODUCT_BUNDLE_IDENTIFIER' not in block:
                  return block
              block = re.sub(r'CODE_SIGN_STYLE = \w+;', 'CODE_SIGN_STYLE = Manual;', block)
              block = re.sub(r'\s*DEVELOPMENT_TEAM = [^;]*;', '', block)
              block = re.sub(r'\s*PROVISIONING_PROFILE_SPECIFIER = [^;]*;', '', block)
              block = re.sub(r'"?CODE_SIGN_IDENTITY(\[sdk=iphoneos\*\])?"? = [^;]*;', '', block)
              block = re.sub(r'MARKETING_VERSION = [^;]*;', f'MARKETING_VERSION = {ver};', block)
              block = re.sub(r'CURRENT_PROJECT_VERSION = [^;]*;', f'CURRENT_PROJECT_VERSION = {build};', block)
              block = re.sub(r'TARGETED_DEVICE_FAMILY = [^;]*;', 'TARGETED_DEVICE_FAMILY = 1;', block)
              block = block.replace('buildSettings = {', 'buildSettings = {\n\t\t\t\tDEVELOPMENT_TEAM = %s;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "%s";\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";' % (team, prof), 1)
              return block
          s = re.sub(r'(\w+ /\* (?:Debug|Release) \*/ = \{\s*isa = XCBuildConfiguration;.*?\n\t\t\};)', lambda m: fix(m.group(1)), s, flags=re.S)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PL" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PL"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Apex Job" "$PL" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Apex Job" "$PL"
          grep -n "PROVISIONING_PROFILE_SPECIFIER\|MARKETING_VERSION\|TARGETED_DEVICE_FAMILY" ios/App/App.xcodeproj/project.pbxproj | head

      - name: ساخت (Archive) و خروجی IPA
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive | tail -40
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP"/out/*.ipa "$GITHUB_WORKSPACE/ApexJob.ipa"
          ls -la "$GITHUB_WORKSPACE/ApexJob.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ApexJob-ios
          path: ApexJob.ipa

      - name: ارسال به App Store Connect (TestFlight)
        if: inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::warning::کلید App Store Connect تنظیم نشده؛ فایل ApexJob.ipa در Artifacts آماده است."; exit 0; fi
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app -f ApexJob.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
